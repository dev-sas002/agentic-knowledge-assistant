# The console's look: a kitchen-pass palette (paprika, saffron, herb green on
# warm paper) with Source Serif 4 for headings and IBM Plex Sans for text.
[theme]
base = "light"
primaryColor = "#B4441E"
backgroundColor = "#FBF7F1"
secondaryBackgroundColor = "#F2EADF"
textColor = "#2B2622"
linkColor = "#9A3412"
borderColor = "#E3D8C9"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
baseRadius = "0.5rem"

[browser]
gatherUsageStats = false
